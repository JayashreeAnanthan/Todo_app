<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .box {
            background: rgba(0,0,0,0.7);
            padding: 25px;
            width: 420px;
            border-radius: 12px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #00d26a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        h2 {
            text-align: center;
        }

        .task {
            margin-top: 10px;
            padding: 10px;
            background: #2d2d44;
            border-radius: 6px;
        }

        .high { color: #ff4c4c; }
        .medium { color: #ffcc00; }
        .low { color: #00ffcc; }

        a {
            color: #9effc8;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>📝 To-Do List</h2>

    <form method="POST">
        <input type="text" name="task" placeholder="Enter task" required>

        <select name="priority" required>
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low">Low Priority</option>
        </select>

        <button type="submit">Add Task</button>
    </form>

    <h3>🕒 Pending Tasks</h3>
    {% for task in tasks %}
        {% if not task.completed %}
        <div class="task">
            <span class="{{ task.priority }}">
                {{ task.name }} ({{ task.priority }})
            </span>
            <br>
            <a href="/complete/{{ loop.index0 }}">✔ Mark Completed</a>
        </div>
        {% endif %}
    {% endfor %}

    <h3>✅ Completed Tasks</h3>
    {% for task in tasks %}
        {% if task.completed %}
        <div class="task">
            ✔ {{ task.name }} ({{ task.priority }})
        </div>
        {% endif %}
    {% endfor %}
</div>

</body>
</html>
